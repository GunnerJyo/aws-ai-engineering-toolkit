[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aws-ai-engineering-toolkit"
version = "0.1.0"
description = "Reusable building blocks for AI applications on AWS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jyothish Nalinakshan" }]
dependencies = ["boto3>=1.35,<2"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13"]

[project.optional-dependencies]
strands = ["strands-agents>=1.0"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "pip-audit>=2.7", "PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/aws_ai_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: explicitly opt-in live AWS tests; may incur charges"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
